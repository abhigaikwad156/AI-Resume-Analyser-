<!DOCTYPE html>
<html>
<head>
    <title>Candidate Authentication</title>
</head>
<body>
    <h2>Candidate Access</h2>
    <p>Create a candidate account first. If you already have one, use the sign-in form below.</p>

    <h3>Sign Up</h3>
    <form method="POST" action="{{ url_for('candidate_register') }}">
        <label>Username:</label><br>
        <input type="text" name="username" required><br><br>
        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>
        <label>Confirm Password:</label><br>
        <input type="password" name="confirm_password" required><br><br>
        <button type="submit">Sign Up</button>
    </form>

    <h3>Already have an account?</h3>
    <form method="POST" action="{{ url_for('candidate_login') }}">
        <label>Username:</label><br>
        <input type="text" name="username" required><br><br>
        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>
        <button type="submit">Sign In</button>
    </form>

    <p><a href="{{ url_for('home') }}">Change role</a></p>
</body>
</html>
